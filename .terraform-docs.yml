formatter: markdown table

# The "providers" section is intentionally omitted: terraform-docs renders the
# *resolved* provider version there, which floats with every AWS provider
# release (no lock file is committed). Including it would make the CI docs-diff
# check fail on every provider release. The "requirements" section still
# documents the meaningful version constraint (>= 6.0).
sections:
  show:
    - requirements
    - inputs
    - outputs

output:
  file: README.md
  mode: inject
  template: |-
    <!-- BEGIN_TF_DOCS -->
    {{ .Content }}
    <!-- END_TF_DOCS -->
