name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly drift check: re-resolves the Terraform CLI (~> 1.9) and the AWS
  # provider (>= 6.0, no committed lock file) to their latest versions and runs
  # the full job, catching breaking Terraform/provider releases. A red run
  # emails the repo owner. Sunday 22:00 UTC = Monday 08:00 AEST. Note: GitHub
  # auto-suspends scheduled workflows after 60 days with no repo activity.
  schedule:
    - cron: "0 22 * * 0"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~> 1.9"

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@v6

      - name: Init tflint
        run: tflint --init

      - name: Run tflint
        run: tflint --recursive

      - name: Terraform Test
        run: terraform test

      - name: Install terraform-docs
        run: |
          curl -sSLo /tmp/terraform-docs.tar.gz https://github.com/terraform-docs/terraform-docs/releases/download/v0.24.0/terraform-docs-v0.24.0-linux-amd64.tar.gz
          tar -xzf /tmp/terraform-docs.tar.gz -C /tmp terraform-docs
          sudo mv /tmp/terraform-docs /usr/local/bin/

      - name: Check terraform-docs
        run: |
          terraform-docs .
          git diff --exit-code README.md
